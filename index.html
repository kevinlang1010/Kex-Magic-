der:2px solid #e7bf76;background:#344762}.cal-dots{display:flex;gap:3px;align-items:center;justify-content:center;min-height:12px}.cal-dots i{display:block;width:6px;height:6px;border-radius:50%}.cal-dot-booked{background:#e7bf76}.cal-dot-pending{background:#69a9e4}.cal-more{font-size:10px}.cal-alert{font-size:10px;color:#e7bf76;position:absolute;right:2px;bottom:1px}.cal-legend{font-size:12px}.cal-details{border-top:1px solid #344359;margin-top:14px;padding-top:12px}.cal-details h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px}.cal-details .item{margin-bottom:9px}@media(max-width:430px){.cal-day.cal-date,.cal-day.cal-blank{min-height:48px}.cal-grid{gap:3px}}</style></head><body><header><strong>KEX MAGIC</strong><small>Business Manager · Milestone 1.6.4</small></header><nav class="nav" id="nav"></nav><main id="app"></main><script>
const KEY='kex-business-v1';const defaultRates={private_show:[500,450],private_strolling:[550,450],corporate_show:[750,650],corporate_strolling:[800,700],community_show:[500,400],community_strolling:[500,400],birthday_30:[300,300],birthday_45:[350,350],birthday_60:[425,425]};const defaults=()=>({leads:[],customers:[],rates:structuredClone(defaultRates),settings:{travelHourly:100,freeTravelMinutes:45,extraStroll:200,extraShow:150,corporateExtraStroll:250,rounding:10,waitThreshold:30,feePercent:2.5,followDays:3,setupMinutes:15,breakdownMinutes:10,birthdayStroll:100,depositPercent:25,depositIncrement:25,depositDueDays:3}});let data;try{data=JSON.parse(localStorage.getItem(KEY))||defaults()}catch(e){data=defaults()}data={...defaults(),...data,rates:{...structuredClone(defaultRates),...(data.rates||{})},settings:{...defaults().settings,...(data.settings||{})}};let demoMode=false,realData=null;let page='Dashboard',editing=null,messageEditor=null,calendarMonth=new Date().toISOString().slice(0,7),calendarSelected=new Date().toISOString().slice(0,10);const pages=['Dashboard','Inquiries','Pricing','Bookings','Calendar','Customers','Reports','Settings'];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'$'+Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2}),save=()=>{if(demoMode)return;try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('Could not save locally. Export your data and check browser storage.')}},id=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),date=()=>new Date().toISOString().slice(0,10),addDays=(d,n)=>{let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)},label=k=>({private_show:'Adult private · parlor show',private_strolling:'Adult private · strolling',corporate_show:'Corporate · parlor show',corporate_strolling:'Corporate · strolling',community_show:'Family/community · show',community_strolling:'Family/community · strolling',birthday_30:'Children’s birthday · 30-minute show',birthday_45:'Children’s birthday · 45-minute show',birthday_60:'Children’s birthday · 60-minute show'}[k]||k),statuses=['Open','Quoted','Booked','Declined — unknown','Booked another performer','Price objection','Unavailable','Canceled'];function nav(p){page=p;editing=null;messageEditor=null;render()}function render(){document.querySelector('header small').textContent=demoMode?'DEMO MODE · Nothing saved to your real records':'Business Manager · Milestone 1.6.4'; $('nav').innerHTML=pages.map(p=>`<button class="${p===page?'active':''}" onclick="nav('${p}')">${p}</button>`).join('');$('app').innerHTML=(demoMode?`<section class="panel" style="border:2px solid #e7bf76"><strong>DEMO MODE — Fictional customer</strong><p>Changes here are temporary and never saved to your real records.</p><button class="primary" onclick="exitDemo()">Exit demo and return to real records</button></section>`:'')+({Dashboard:dashboard,Inquiries:inquiries,Pricing:pricing,Bookings:bookings,Calendar:calendar,Customers:customers,Reports:reports,Settings:settings})[page]();}const booked=()=>data.leads.filter(x=>x.status==='Booked'),quoted=()=>data.leads.filter(x=>x.quotedPrice>0),sum=(a,f)=>a.reduce((s,x)=>s+Number(f(x)||0),0),avg=(a,f)=>a.length?sum(a,f)/a.length:0;function dashboard(){let b=booked(),q=quoted(),open=data.leads.filter(x=>['Open','Quoted','Follow-up needed'].includes(x.status)),due=open.filter(x=>x.followDate&&x.followDate<=date()).sort((a,b)=>a.followDate.localeCompare(b.followDate));let upcoming=open.filter(x=>x.followDate&&x.followDate>date()).sort((a,b)=>a.followDate.localeCompare(b.followDate));let awaiting=open.filter(x=>x.quotedPrice>0&&!x.quoteSentDate);let overdue=b.filter(x=>paymentInfo(x).depositOutstanding>0&&x.payment?.depositDue&&x.payment.depositDue<date());return `<h1>Business overview</h1><p class="muted">Your actual records. No sample bookings.</p><div class="grid"><div class="metric">Inquiries<b>${data.leads.length}</b></div><div class="metric">Booked gigs<b>${b.length}</b></div><div class="metric">Conversion<b>${q.length?Math.round(b.length/q.length*100):0}%</b></div><div class="metric">Booked revenue<b>${money(sum(b,x=>x.bookedPrice))}</b></div></div><section class="panel"><h2>Overdue deposits</h2>${overdue.length?overdue.map(x=>`<div class="item"><strong class="warning">${esc(x.eventName)}</strong><small>${money(paymentInfo(x).depositOutstanding)} outstanding since ${esc(x.payment.depositDue)} · booking remains confirmed</small><div class="actions"><button class="secondary" onclick="openPayment('${x.id}')">Review payment</button></div></div>`).join(''):'<div class="empty">No overdue deposits.</div>'}</section><section class="panel"><h2>Needs attention</h2>${due.length?due.map(x=>`<div class="item"><strong>${esc(x.eventName||'Unnamed event')}</strong><small>Follow-up due ${esc(x.followDate)} · ${esc(x.customerName)}</small><div class="actions"><button class="secondary" onclick="draftFollowup('${x.id}')">Message</button><button class="secondary" onclick="logFollowup('${x.id}')">Complete</button><button class="secondary" onclick="rescheduleFollowup('${x.id}')">Reschedule</button><button class="secondary" onclick="toggleLeadHistory('${x.id}')">History</button><button class="secondary" onclick="editLead('${x.id}')">Review</button></div><div id="history-${x.id}" class="hidden">${leadHistory(x)}</div></div>`).join(''):'<div class="empty">No follow-ups due.</div>'}</section><section class="panel"><h2>Upcoming follow-ups (${upcoming.length})</h2>${upcoming.length?upcoming.map(x=>`<div class="item"><strong>${esc(x.customerName||'Unnamed customer')} — ${esc(x.eventName||'Event')}</strong><small>Follow up ${esc(x.followDate)} · ${money(x.quotedPrice)} quoted</small><div class="actions"><button class="secondary" onclick="draftFollowup('${x.id}')">Message</button><button class="secondary" onclick="logFollowup('${x.id}')">Complete</button><button class="secondary" onclick="rescheduleFollowup('${x.id}')">Reschedule</button><button class="secondary" onclick="toggleLeadHistory('${x.id}')">History</button><button class="secondary" onclick="editLead('${x.id}')">Review</button></div><div id="history-${x.id}" class="hidden">${leadHistory(x)}</div></div>`).join(''):'<div class="empty">No upcoming follow-ups scheduled.</div>'}</section><section class="panel"><h2>Quotes awaiting send date (${awaiting.length})</h2>${awaiting.length?awaiting.map(x=>`<div class="item"><strong>${esc(x.customerName)} — ${esc(x.eventName)}</strong><small>${money(x.quotedPrice)} quoted · Send date not recorded</small><div class="actions"><button class="secondary" onclick="editLead('${x.id}')">Review inquiry</button></div></div>`).join(''):'<div class="empty">No unsent or undated quotes.</div>'}</section><section class="panel"><h2>Recent inquiries</h2>${data.leads.length?data.leads.slice().reverse().slice(0,5).map(x=>`<div class="item"><strong>${esc(x.eventName||'Event')} <span class="pill">${esc(x.status)}</span></strong><small>${esc(x.customerName)} · ${esc(x.eventDate)} · ${money(x.quotedPrice)}</small></div>`).join(''):'<div class="empty">Add your first inquiry to begin tracking your business.</div>'}<div class="actions"><button class="primary" onclick="nav('Inquiries')">Add inquiry</button><button class="secondary" onclick="nav('Pricing')">Create quote</button></div></section>`}
function durationFromTimes(start,end){if(!start||!end)return null;const a=start.split(':').map(Number),b=end.split(':').map(Number);if(a.length!==2||b.length!==2||![...a,...b].every(Number.isFinite))return null;const delta=((b[0]*60+b[1])-(a[0]*60+a[1])+1440)%1440;return delta||null}
function leadDurationChanged(){const f=$('leadForm');if(!f)return;const duration=durationFromTimes(f.elements.startTime.value,f.elements.endTime.value);if(!f.elements.durationManual.checked&&duration!==null)f.elements.duration.value=duration;}
function leadDurationOverride(){const f=$('leadForm');if(!f)return;f.elements.duration.readOnly=!f.elements.durationManual.checked;if(!f.elements.durationManual.checked)leadDurationChanged()}
function leadQuoteSentChanged(){const f=$('leadForm');if(!f)return;const sent=f.elements.quoteSentDate.value;if(!f.elements.followManual.checked)f.elements.followDate.value=sent?addDays(sent,Number(data.settings.followDays)):''}
function leadFollowOverride(){const f=$('leadForm');if(!f)return;f.elements.followDate.readOnly=!f.elements.followManual.checked;if(!f.elements.followManual.checked)leadQuoteSentChanged()}
function leadForm(x={}){return `<section class="panel"><h2>${x.id?'Edit':'New'} inquiry</h2><form id="leadForm" onsubmit="saveLead(event)"><input type="hidden" name="id" value="${esc(x.id||'')}"><label>Customer name</label><input name="customerName" required value="${esc(x.customerName)}"><label>Contact information (optional)</label><input name="contact" value="${esc(x.contact)}"><label>Event name</label><input name="eventName" required value="${esc(x.eventName)}"><div class="grid"><div><label>Event date</label><input name="eventDate" type="date" value="${esc(x.eventDate)}"></div><div><label>Inquiry date</label><input name="inquiryDate" type="date" value="${esc(x.inquiryDate||date())}"></div></div><label>Source</label><select name="source">${['GigSalad','Social media','Website','Referral','Direct','Other'].map(z=>`<option ${x.source===z?'selected':''}>${z}</option>`).join('')}</select><label>Performance</label><select name="rateKey">${Object.keys(data.rates).map(z=>`<option value="${z}" ${x.rateKey===z?'selected':''}>${label(z)}</option>`).join('')}</select><label>Venue / address</label><input name="location" value="${esc(x.location)}"><div class="grid"><div><label>Performance start</label><input name="startTime" type="time" oninput="leadDurationChanged()" value="${esc(x.startTime)}"></div><div><label>Performance end</label><input name="endTime" type="time" oninput="leadDurationChanged()" value="${esc(x.endTime)}"></div></div><h3>Scheduling buffers</h3><p class="note">These times reserve your full commitment for conflict checks. Drive times are entered manually; the app does not calculate road travel automatically.</p><div class="grid"><div><label>Drive to venue (minutes)</label><input name="driveOutbound" type="number" min="0" value="${esc(x.driveOutbound??x.quoteDetails?.driveOutbound??0)}"></div><div><label>Return drive (minutes)</label><input name="driveReturn" type="number" min="0" value="${esc(x.driveReturn??x.quoteDetails?.driveReturn??0)}"></div><div><label>Setup (minutes)</label><input name="setupMinutes" type="number" min="0" value="${esc(x.setupMinutes??data.settings.setupMinutes)}"></div><div><label>Breakdown (minutes)</label><input name="breakdownMinutes" type="number" min="0" value="${esc(x.breakdownMinutes??data.settings.breakdownMinutes)}"></div></div><div id="scheduleWarning" class="note">Save to check scheduling conflicts. Calendar also shows potential overlaps.</div><label>Venue notes</label><textarea name="venueNotes">${esc(x.venueNotes)}</textarea><label>Performance duration (minutes)</label><input name="duration" type="number" min="1" value="${esc(x.duration??durationFromTimes(x.startTime,x.endTime)??60)}" ${x.durationManual?'':'readonly'}><label><input type="checkbox" name="durationManual" value="yes" ${x.durationManual?'checked':''} onchange="leadDurationOverride()"> Edit duration manually</label><p class="note">Automatically calculated from start and end times, including overnight events. Check the box to override.</p><label>Quote amount ($)</label><input name="quotedPrice" type="number" min="0" step="0.01" value="${esc(x.quotedPrice??'')}"><label>Final booked fee ($)</label><input name="bookedPrice" type="number" min="0" step="0.01" value="${esc(x.bookedPrice??'')}"><label>Status</label><select name="status">${statuses.filter(z=>z!=='Booked'||x.status==='Booked').map(z=>`<option ${x.status===z?'selected':''}>${z}</option>`).join('')}</select><label>Quote sent date</label><input name="quoteSentDate" type="date" value="${esc(x.quoteSentDate||'')}" onchange="leadQuoteSentChanged()"><p class="note">Enter the date you actually sent the quote, not the date you saved it.</p><label>Follow-up date (open inquiries only)</label><input name="followDate" type="date" value="${esc(x.followDate||((x.quoteSentDate&&!x.followManual)?addDays(x.quoteSentDate,Number(data.settings.followDays)):'') )}" ${x.followManual?'':'readonly'}><label><input type="checkbox" name="followManual" value="yes" ${x.followManual?'checked':''} onchange="leadFollowOverride()"> Edit follow-up date manually</label><label>Below-floor exception reason</label><input name="exception" value="${esc(x.exception)}" placeholder="Required if quote is below your minimum"><label>Lost lead reason (optional)</label><select name="lostReason"><option value="">Not specified</option>${["Price","Booked another performer","Date unavailable","No response","Event canceled","Other"].map(z=>`<option value="${z}" ${x.lostReason===z?"selected":""}>${z}</option>`).join("")}</select><label>Notes / customer feedback</label><textarea name="notes">${esc(x.notes)}</textarea><div class="actions"><button class="primary" type="submit">Save inquiry</button><button class="secondary" type="button" onclick="editing=null;render()">Cancel</button></div></form></section>`}function inquiries(){return `<h1>Inquiries</h1><p class="muted">Capture every opportunity and its outcome.</p><div class="actions"><button class="primary" onclick="editing={};render()">+ New inquiry</button></div>${editing!==null?leadForm(editing):''}${messageEditor?messageEditorPanel():''}<section class="panel"><h2>All inquiries (${data.leads.length})</h2>${data.leads.length?data.leads.slice().reverse().map(x=>`<div class="item"><strong>${esc(x.eventName)} <span class="pill">${esc(x.status)}</span></strong><small>${esc(x.customerName)} · ${esc(x.source)} · ${esc(x.eventDate||'Date TBD')}</small><p>${money(x.quotedPrice)} quoted ${x.status==='Booked'?'· '+money(x.bookedPrice)+' booked':''}</p><div class="actions"><button class="secondary" onclick="editLead('${x.id}')">Edit</button><button class="secondary" onclick="draft('${x.id}')">Messages</button>${['Open','Quoted','Follow-up needed'].includes(x.status)?`<button class="secondary" onclick="markQuoteSent('${x.id}')">Record quote sent</button><button class="secondary" onclick="logFollowup('${x.id}')">Record follow-up</button>`:''}${x.status!=='Booked'?`<button class="secondary" onclick="confirmBooking('${x.id}')">Confirm booking</button>`:''}<button class="danger" onclick="deleteLead('${x.id}')">Delete</button></div>${x.lostReason?`<small>Lost reason: ${esc(x.lostReason)}</small>`:''}${leadHistory(x)}</div>`).join(''):'<div class="empty">No inquiries yet.</div>'}</section>`}function editLead(i){editing=data.leads.find(x=>x.id===i);page='Inquiries';render();window.scrollTo(0,0)}function saveLead(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.durationManual=o.durationManual==='yes';o.followManual=o.followManual==='yes';if(!o.durationManual){const computed=durationFromTimes(o.startTime,o.endTime);if(computed!==null)o.duration=String(computed)}if(!o.followManual)o.followDate=o.quoteSentDate?addDays(o.quoteSentDate,Number(data.settings.followDays)):'';let previous=data.leads.find(x=>x.id===o.id);o.id=o.id||id();o.duration=Number(o.duration);o.quotedPrice=Number(o.quotedPrice||0);o.bookedPrice=Number(o.bookedPrice||0);let floor=data.rates[o.rateKey]?.[1]||0;if(o.quotedPrice>0&&o.quotedPrice<floor&&!o.exception.trim()){alert('This quote is below your internal minimum of '+money(floor)+'. Enter a reason for the exception.');return}if(o.status==='Booked'&&!o.bookedPrice){alert('Enter the final booked fee for a booked event.');return}if(!['Open','Quoted'].includes(o.status))o.followDate='';o.history=previous?.history||[];if(previous){
 o.payment=previous.payment;o.quoteDetails=previous.quoteDetails;o.confirmedAt=previous.confirmedAt;
 if(o.status==='Booked'&&o.payment&&previous.eventDate!==o.eventDate&&!o.payment.balanceDueManual){
  o.payment.balanceDue=o.eventDate||'';
 }
}if(previous&&previous.quoteSentDate!==o.quoteSentDate&&o.quoteSentDate)o.history.push({at:new Date().toISOString(),event:'Quote sent date recorded',quoteSentDate:o.quoteSentDate});if(previous&&previous.followDate!==o.followDate)o.history.push({at:new Date().toISOString(),event:'Follow-up date updated',followDate:o.followDate});if(!previous||Number(previous.quotedPrice)!==o.quotedPrice||previous.status!==o.status||Number(previous.bookedPrice)!==o.bookedPrice)o.history.push({at:new Date().toISOString(),quotedPrice:o.quotedPrice,bookedPrice:o.bookedPrice,status:o.status});const overlaps=conflictsFor(o,previous?.id||null);if(overlaps.length){const detail=overlaps.map(z=>z.eventName+' ('+z.status+')').join(', ');if(o.status==='Booked'&&!confirm('SCHEDULING CONFLICT with '+detail+'.\n\nSave this confirmed booking anyway?'))return; if(o.status!=='Booked')alert('Potential scheduling conflict with '+detail+'. Inquiry can still be saved.')}if(previous)Object.assign(previous,o);else data.leads.push(o);if(o.customerName&&!data.customers.some(c=>c.name.toLowerCase()===o.customerName.toLowerCase()))data.customers.push({id:id(),name:o.customerName,contact:o.contact});save();editing=null;render()}function deleteLead(i){if(confirm('Delete this inquiry and its history?')){data.leads=data.leads.filter(x=>x.id!==i);save();render()}}function draftFollowup(i){const x=data.leads.find(z=>z.id===i);if(!x)return;page='Inquiries';editing=null;messageEditor={id:i,type:'followup',text:messageText(x,'followup')};render();$('messageBody')?.scrollIntoView({block:'center',behavior:'smooth'})}

];let pdf='%PDF-1.4\n',offsets=[0];for(let i=0;i<objs.length;i++){offsets.push(pdf.length);pdf+=`${i+1} 0 obj\n${objs[i]}\nendobj\n`}const xref=pdf.length;pdf+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`;for(let i=1;i<offsets.length;i++)pdf+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';pdf+=`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;download(filename,pdf,'application/pdf')}

function settings(){return `<h1>Settings</h1><section class="panel"><h2>Safe demo mode</h2><p>Explore invoices, deposit requests, payment reminders, and payment recording using a fictional booking. Demo changes stay in memory only and disappear when you exit or reload.</p><button class="primary" onclick="enterDemo()">Start demo mode</button></section><section class="panel"><h2>Rate card</h2><form onsubmit="saveSettings(event)">${Object.entries(data.rates).map(([k,v])=>`<div class="item"><strong>${label(k)}</strong><div class="grid"><div><label>Standard ($)</label><input type="number" min="0" name="std_${k}" value="${v[0]}"></div><div><label>Internal floor ($)</label><input type="number" min="0" name="floor_${k}" value="${v[1]}"></div></div></div>`).join('')}<p class="note">Show prices are fixed for a complete 45–60-minute show. Combo packages add strolling in 30-minute blocks; standalone strolling includes the first 60 minutes. Family/community combination pricing is not established yet.</p><h2>Pricing and reminders</h2>${[['travelHourly','Additional round-trip driving ($ per hour)'],['freeTravelMinutes','Included driving time each way (minutes)'],['extraStroll','Adult private additional 30 minutes strolling ($)'],['corporateExtraStroll','Corporate additional 30 minutes strolling ($)'],['rounding','Round quotes upward to nearest ($)'],['waitThreshold','Waiting-time warning threshold (minutes)'],['feePercent','GigSalad platform fee estimate (%)'],['followDays','Follow-up delay (days)'],['setupMinutes','Default setup time (minutes)'],['breakdownMinutes','Default breakdown time (minutes)'],['birthdayStroll','Birthday strolling per 30 minutes ($)'],['depositPercent','Standard deposit (%)'],['depositIncrement','Round deposit upward to ($)'],['depositDueDays','Deposit due after confirmation (days)']].map(([k,l])=>`<label>${l}</label><input type="number" min="0" step="any" name="${k}" value="${data.settings[k]}">`).join('')}<div class="actions"><button class="primary" type="submit">Save settings</button></div></form></section><section class="panel"><h2>Backup and restore</h2><p class="muted">Data is stored only in this browser. Clearing site data or using another device may remove access. Export backups regularly.</p><div class="actions"><button class="secondary" onclick="exportJSON()">Export backup (JSON)</button><button class="secondary" onclick="exportCSV()">Export inquiries (CSV)</button></div><label>Restore JSON backup</label><input type="file" id="importFile" accept=".json,application/json" onchange="importJSON(event)"><p class="note">Restoring replaces all current app data. Keep your exported backup in a secure location because it may contain customer contact details.</p></section>`}function saveSettings(e){e.preventDefault();let f=new FormData(e.target);for(let k of Object.keys(data.rates)){let a=Number(f.get('std_'+k)),b=Number(f.get('floor_'+k));if(b>a){alert('Internal floor cannot exceed standard rate: '+label(k));return}data.rates[k]=[a,b]}for(let k of Object.keys(data.settings)){if(f.has(k))data.settings[k]=Number(f.get(k))}if(data.settings.depositIncrement<=0||data.settings.depositPercent<0||data.settings.depositPercent>100){alert('Check deposit settings');return}if(data.settings.rounding<=0){alert('Rounding increment must be positive.');return}save();alert('Settings saved');render()}function download(name,contents,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([contents],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function exportJSON(){if(demoMode)return alert('Exit demo mode to export your real backup.');download('kex-magic-backup-'+date()+'.json',JSON.stringify(data,null,2),'application/json')}function exportCSV(){if(demoMode)return alert('Exit demo mode to export your real inquiries.');let keys=['customerName','contact','eventName','eventDate','inquiryDate','source','rateKey','location','duration','quotedPrice','bookedPrice','status','followDate','exception','notes'];let lines=[keys.join(','),...data.leads.map(x=>keys.map(k=>'"'+String(x[k]??'').replace(/"/g,'""')+'"').join(','))];download('kex-magic-inquiries-'+date()+'.csv',lines.join('\r\n'),'text/csv')}async function importJSON(e){if(demoMode){alert('Exit demo mode before restoring a backup.');return}let file=e.target.files[0];if(!file)return;try{let v=JSON.parse(await file.text());if(!Array.isArray(v.leads)||!Array.isArray(v.customers)||!v.rates||!v.settings)throw Error('Invalid backup structure');if(!confirm('Replace ALL current data with this backup?'))return;data=v;save();render();alert('Backup restored')}catch(err){alert('Import failed: '+err.message)}}render();if(page==='Pricing')updatePriceUI();const oldNav=nav;nav=function(p){oldNav(p);if(p==='Pricing')updatePriceUI()};
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(err=>console.warn("Offline support unavailable:",err)));}</script></body></html>
