<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>Kex Magic Business Manager</title><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#edf1f7;background:#101827}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{padding:18px 18px 14px;border-bottom:1px solid #303b4c;background:#131e2f;position:sticky;top:0;z-index:3}header strong{letter-spacing:.12em;color:#e7bf76}header small{display:block;color:#9faec1;margin-top:4px}main{max-width:950px;margin:auto;padding:20px 16px 110px}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;overflow-x:auto;gap:4px;padding:9px 7px calc(9px + env(safe-area-inset-bottom));background:#182438;border-top:1px solid #354158;z-index:4}.nav button{border:0;background:none;color:#acbbd0;flex:1;min-width:72px;font-size:12px;padding:10px 3px;border-radius:10px}.nav button.active{background:#33435a;color:#ffdb98}.panel{background:#1b293d;border:1px solid #344359;border-radius:15px;padding:17px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.metric{background:#24354b;border-radius:12px;padding:15px}.metric b{font-size:25px;display:block;color:#f5d093;margin-top:7px}.muted,small{color:#aebbd0}h1{font-size:24px;margin:0 0 7px}h2{font-size:18px;margin:0 0 14px}h3{font-size:16px}p{line-height:1.5}label{display:block;font-size:13px;color:#c4d0df;margin:12px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid #50617a;background:#101c2d;border-radius:9px;color:white;min-height:45px}textarea{min-height:95px}button.primary{background:#e2b96d;color:#172032;border:0;border-radius:9px;padding:12px 16px;font-weight:750}button.secondary{background:#30425a;color:#fff;border:1px solid #50617a;border-radius:9px;padding:11px 14px}button.danger{background:#583440;color:#fff;border:1px solid #a36b75;border-radius:9px;padding:10px 12px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.item{border-bottom:1px solid #39485b;padding:12px 0}.item:last-child{border:0}.item strong{display:block;margin-bottom:4px}.pill{display:inline-block;background:#344b5d;padding:3px 8px;border-radius:15px;font-size:11px;color:#d9e6f2}.good{color:#a9e1bc}.warning{color:#ffca85}.error{color:#ff9b9b}.hidden{display:none!important}.empty{color:#b6c2d1;text-align:center;padding:25px 10px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid #39485b;text-align:left;padding:10px 5px}th{color:#c6d4e5}.note{border-left:3px solid #e2b96d;padding:10px;background:#28364a;font-size:13px}a{color:#f5cd87}@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.nav{position:static;justify-content:center}.nav button{flex:0 1 120px}main{padding-bottom:30px}} </style></head><body><header><strong>KEX MAGIC</strong><small>Business Manager · Milestone 1</small></header><nav class="nav" id="nav"></nav><main id="app"></main><script>
const KEY='kex-business-v1';const defaultRates={private_show:[500,450],private_strolling:[550,450],corporate_show:[750,650],corporate_strolling:[800,700],community_show:[500,400],community_strolling:[500,400]};const defaults=()=>({leads:[],customers:[],rates:structuredClone(defaultRates),settings:{travelRate:0.7,freeMiles:20,extraStroll:225,extraShow:150,feePercent:2.5,followDays:3}});let data;try{data=JSON.parse(localStorage.getItem(KEY))||defaults()}catch(e){data=defaults()}data={...defaults(),...data};let page='Dashboard',editing=null;const pages=['Dashboard','Inquiries','Pricing','Bookings','Customers','Reports','Settings'];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'$'+Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2}),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('Could not save locally. Export your data and check browser storage.')}},id=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),date=()=>new Date().toISOString().slice(0,10),addDays=(d,n)=>{let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)},label=k=>({private_show:'Adult private · parlor show',private_strolling:'Adult private · strolling',corporate_show:'Corporate · parlor show',corporate_strolling:'Corporate · strolling',community_show:'Family/community · show',community_strolling:'Family/community · strolling'}[k]||k),statuses=['Open','Quoted','Booked','Declined — unknown','Booked another performer','Price objection','Unavailable','Canceled'];function nav(p){page=p;editing=null;render()}function render(){ $('nav').innerHTML=pages.map(p=>`<button class="${p===page?'active':''}" onclick="nav('${p}')">${p}</button>`).join('');$('app').innerHTML=({Dashboard:dashboard,Inquiries:inquiries,Pricing:pricing,Bookings:bookings,Customers:customers,Reports:reports,Settings:settings})[page]();}const booked=()=>data.leads.filter(x=>x.status==='Booked'),quoted=()=>data.leads.filter(x=>x.quotedPrice>0),sum=(a,f)=>a.reduce((s,x)=>s+Number(f(x)||0),0),avg=(a,f)=>a.length?sum(a,f)/a.length:0;function dashboard(){let b=booked(),q=quoted(),open=data.leads.filter(x=>['Open','Quoted'].includes(x.status)),due=open.filter(x=>x.followDate&&x.followDate<=date());return `<h1>Business overview</h1><p class="muted">Your actual records. No sample bookings.</p><div class="grid"><div class="metric">Inquiries<b>${data.leads.length}</b></div><div class="metric">Booked gigs<b>${b.length}</b></div><div class="metric">Conversion<b>${q.length?Math.round(b.length/q.length*100):0}%</b></div><div class="metric">Booked revenue<b>${money(sum(b,x=>x.bookedPrice))}</b></div></div><section class="panel"><h2>Needs attention</h2>${due.length?due.map(x=>`<div class="item"><strong>${esc(x.eventName||'Unnamed event')}</strong><small>Follow-up due ${esc(x.followDate)} · ${esc(x.customerName)}</small><div class="actions"><button class="secondary" onclick="editLead('${x.id}')">Review</button></div></div>`).join(''):'<div class="empty">No follow-ups due.</div>'}</section><section class="panel"><h2>Recent inquiries</h2>${data.leads.length?data.leads.slice().reverse().slice(0,5).map(x=>`<div class="item"><strong>${esc(x.eventName||'Event')} <span class="pill">${esc(x.status)}</span></strong><small>${esc(x.customerName)} · ${esc(x.eventDate)} · ${money(x.quotedPrice)}</small></div>`).join(''):'<div class="empty">Add your first inquiry to begin tracking your business.</div>'}<div class="actions"><button class="primary" onclick="nav('Inquiries')">Add inquiry</button><button class="secondary" onclick="nav('Pricing')">Create quote</button></div></section>`}
function leadForm(x={}){return `<section class="panel"><h2>${x.id?'Edit':'New'} inquiry</h2><form id="leadForm" onsubmit="saveLead(event)"><input type="hidden" name="id" value="${esc(x.id||'')}"><label>Customer name</label><input name="customerName" required value="${esc(x.customerName)}"><label>Contact information (optional)</label><input name="contact" value="${esc(x.contact)}"><label>Event name</label><input name="eventName" required value="${esc(x.eventName)}"><div class="grid"><div><label>Event date</label><input name="eventDate" type="date" value="${esc(x.eventDate)}"></div><div><label>Inquiry date</label><input name="inquiryDate" type="date" value="${esc(x.inquiryDate||date())}"></div></div><label>Source</label><select name="source">${['GigSalad','Social media','Website','Referral','Direct','Other'].map(z=>`<option ${x.source===z?'selected':''}>${z}</option>`).join('')}</select><label>Performance</label><select name="rateKey">${Object.keys(data.rates).map(z=>`<option value="${z}" ${x.rateKey===z?'selected':''}>${label(z)}</option>`).join('')}</select><label>Location</label><input name="location" value="${esc(x.location)}"><label>Duration (minutes)</label><input name="duration" type="number" min="1" value="${esc(x.duration||60)}"><label>Quote amount ($)</label><input name="quotedPrice" type="number" min="0" step="0.01" value="${esc(x.quotedPrice??'')}"><label>Final booked fee ($)</label><input name="bookedPrice" type="number" min="0" step="0.01" value="${esc(x.bookedPrice??'')}"><label>Status</label><select name="status">${statuses.map(z=>`<option ${x.status===z?'selected':''}>${z}</option>`).join('')}</select><label>Follow-up date (open inquiries only)</label><input name="followDate" type="date" value="${esc(x.followDate)}"><label>Below-floor exception reason</label><input name="exception" value="${esc(x.exception)}" placeholder="Required if quote is below your minimum"><label>Notes / customer feedback</label><textarea name="notes">${esc(x.notes)}</textarea><div class="actions"><button class="primary" type="submit">Save inquiry</button><button class="secondary" type="button" onclick="editing=null;render()">Cancel</button></div></form></section>`}function inquiries(){return `<h1>Inquiries</h1><p class="muted">Capture every opportunity and its outcome.</p><div class="actions"><button class="primary" onclick="editing={};render()">+ New inquiry</button></div>${editing!==null?leadForm(editing):''}<section class="panel"><h2>All inquiries (${data.leads.length})</h2>${data.leads.length?data.leads.slice().reverse().map(x=>`<div class="item"><strong>${esc(x.eventName)} <span class="pill">${esc(x.status)}</span></strong><small>${esc(x.customerName)} · ${esc(x.source)} · ${esc(x.eventDate||'Date TBD')}</small><p>${money(x.quotedPrice)} quoted ${x.status==='Booked'?'· '+money(x.bookedPrice)+' booked':''}</p><div class="actions"><button class="secondary" onclick="editLead('${x.id}')">Edit</button><button class="secondary" onclick="draft('${x.id}')">Message</button><button class="danger" onclick="deleteLead('${x.id}')">Delete</button></div></div>`).join(''):'<div class="empty">No inquiries yet.</div>'}</section>`}function editLead(i){editing=data.leads.find(x=>x.id===i);page='Inquiries';render();window.scrollTo(0,0)}function saveLead(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));let previous=data.leads.find(x=>x.id===o.id);o.id=o.id||id();o.duration=Number(o.duration);o.quotedPrice=Number(o.quotedPrice||0);o.bookedPrice=Number(o.bookedPrice||0);let floor=data.rates[o.rateKey]?.[1]||0;if(o.quotedPrice>0&&o.quotedPrice<floor&&!o.exception.trim()){alert('This quote is below your internal minimum of '+money(floor)+'. Enter a reason for the exception.');return}if(o.status==='Booked'&&!o.bookedPrice){alert('Enter the final booked fee for a booked event.');return}if(!['Open','Quoted'].includes(o.status))o.followDate='';if(o.status==='Quoted'&&!o.followDate)o.followDate=addDays(date(),Number(data.settings.followDays));o.history=previous?.history||[];if(!previous||Number(previous.quotedPrice)!==o.quotedPrice||previous.status!==o.status||Number(previous.bookedPrice)!==o.bookedPrice)o.history.push({at:new Date().toISOString(),quotedPrice:o.quotedPrice,bookedPrice:o.bookedPrice,status:o.status});if(previous)Object.assign(previous,o);else data.leads.push(o);if(o.customerName&&!data.customers.some(c=>c.name.toLowerCase()===o.customerName.toLowerCase()))data.customers.push({id:id(),name:o.customerName,contact:o.contact});save();editing=null;render()}function deleteLead(i){if(confirm('Delete this inquiry and its history?')){data.leads=data.leads.filter(x=>x.id!==i);save();render()}}function draft(i){let x=data.leads.find(z=>z.id===i),follow=x.status==='Quoted';let msg=follow?`Hi ${x.customerName},\n\nI wanted to follow up on the entertainment quote I sent for ${x.eventName}. I'd love to help make your event memorable. Please let me know if you have any questions about the performance or format.\n\nKex\nKex Magic`:`Hi ${x.customerName},\n\nThank you for considering Kex Magic for ${x.eventName}! I'd love to create an interactive, memorable experience for your guests.\n\nFor your event, I recommend ${label(x.rateKey).toLowerCase()} at ${money(x.quotedPrice)}. I'd be happy to answer any questions about the performance and how it would fit your celebration.\n\nKex\nKex Magic`;if(!['Open','Quoted'].includes(x.status)){alert('This inquiry is closed. Do not send follow-ups unless the customer reopens the conversation.');return}navigator.clipboard.writeText(msg).then(()=>alert('Message copied. Paste and review in GigSalad or your chosen channel.')).catch(()=>prompt('Copy this message:',msg))}
function pricing(){return `<h1>Quote builder</h1><p class="muted">Transparent rule-based recommendations. All customer messages require your approval.</p><section class="panel"><label>Performance type</label><select id="pType" onchange="calc()">${Object.keys(data.rates).map(k=>`<option value="${k}">${label(k)}</option>`).join('')}</select><label>Duration (minutes)</label><input id="pDuration" type="number" min="1" value="60" oninput="calc()"><label>Round-trip travel distance (miles)</label><input id="pMiles" type="number" min="0" value="0" oninput="calc()"><label>Additional special-event charge ($)</label><input id="pExtra" type="number" min="0" value="0" oninput="calc()"><div id="priceResult" class="panel"></div><div class="actions"><button class="primary" onclick="copyPrice()">Copy recommendation</button><button class="secondary" onclick="nav('Inquiries')">Record inquiry</button></div></section><p class="note">Duration add-ons are provisional. Confirm that your show format supports the requested length before committing. Travel uses an editable round-trip mileage allowance, not live driving distances.</p>`}function priceData(){let k=$('pType').value,d=Math.max(1,Number($('pDuration').value)||60),m=Math.max(0,Number($('pMiles').value)||0),special=Math.max(0,Number($('pExtra').value)||0),r=data.rates[k],hours=Math.max(0,(d-60)/60),extension=Math.round(hours*(k.endsWith('strolling')?data.settings.extraStroll:data.settings.extraShow)),travel=Math.round(Math.max(0,m-data.settings.freeMiles)*data.settings.travelRate),price=r[0]+extension+travel+special;return {k,d,m,extension,travel,special,price,floor:r[1]+extension+travel+special}}function calc(){let p=priceData();$('priceResult').innerHTML=`<small>Recommended quote</small><h1 style="color:#f5d093">${money(p.price)}</h1><p>Base ${money(data.rates[p.k][0])} + duration ${money(p.extension)} + travel ${money(p.travel)} + special ${money(p.special)}</p><small>Internal minimum ${money(p.floor)} · GigSalad Pro estimated payout ${money(p.price*(1-data.settings.feePercent/100))}</small>`}function copyPrice(){let p=priceData(),t=`Kex Magic suggested quote: ${money(p.price)}\n${label(p.k)}, ${p.d} minutes\nBase: ${money(data.rates[p.k][0])}; extension: ${money(p.extension)}; travel: ${money(p.travel)}; special: ${money(p.special)}\nSubject to availability and final event details.`;navigator.clipboard.writeText(t).then(()=>alert('Quote details copied')).catch(()=>prompt('Copy quote:',t))}
function bookings(){let b=booked().slice().sort((a,b)=>(a.eventDate||'').localeCompare(b.eventDate||''));return `<h1>Bookings</h1><p class="muted">Confirmed gigs, based on your inquiry records.</p><section class="panel"><h2>${b.length} confirmed performances</h2>${b.length?b.map(x=>`<div class="item"><strong>${esc(x.eventName)}</strong><small>${esc(x.eventDate||'Date TBD')} · ${esc(x.customerName)} · ${esc(x.location)}</small><p class="good">${money(x.bookedPrice)} booked</p><button class="secondary" onclick="editLead('${x.id}')">View booking</button></div>`).join(''):'<div class="empty">No confirmed bookings recorded yet. Mark an inquiry as Booked to see it here.</div>'}</section>`}function customers(){return `<h1>Customers</h1><section class="panel"><h2>Customer directory (${data.customers.length})</h2>${data.customers.length?data.customers.map(c=>`<div class="item"><strong>${esc(c.name)}</strong><small>${esc(c.contact||'No contact details')}</small><p>${data.leads.filter(x=>x.customerName.toLowerCase()===c.name.toLowerCase()).length} inquiries</p><button class="danger" onclick="deleteCustomer('${c.id}')">Remove</button></div>`).join(''):'<div class="empty">Customers will appear here when you save inquiries.</div>'}</section>`}function deleteCustomer(i){if(confirm('Remove this customer from directory? Inquiry history remains.')){data.customers=data.customers.filter(x=>x.id!==i);save();render()}}function reports(){let q=quoted(),b=booked(),n=data.leads.length;let sources=[...new Set(data.leads.map(x=>x.source))];return `<h1>Reports</h1><div class="grid"><div class="metric">Average quote<b>${money(avg(q,x=>x.quotedPrice))}</b></div><div class="metric">Average booked fee<b>${money(avg(b,x=>x.bookedPrice))}</b></div><div class="metric">Booked revenue<b>${money(sum(b,x=>x.bookedPrice))}</b></div><div class="metric">Revenue per inquiry<b>${money(n?sum(b,x=>x.bookedPrice)/n:0)}</b></div></div><section class="panel"><h2>By lead source</h2><table><tr><th>Source</th><th>Inquiries</th><th>Booked</th><th>Conversion</th></tr>${sources.map(s=>{let a=data.leads.filter(x=>x.source===s),k=a.filter(x=>x.status==='Booked').length;return `<tr><td>${esc(s)}</td><td>${a.length}</td><td>${k}</td><td>${Math.round(100*k/a.length)}%</td></tr>`}).join('')}</table>${!sources.length?'<div class="empty">Add inquiries to generate reports.</div>':''}</section><section class="panel"><h2>Booking outcomes</h2>${statuses.map(s=>`<div class="item">${esc(s)}: <strong style="display:inline">${data.leads.filter(x=>x.status===s).length}</strong></div>`).join('')}<p class="note">Small samples can be misleading. Unknown decline reasons are never classified as price objections. Conversion metrics depend on accurate outcome updates.</p></section>`}
function settings(){return `<h1>Settings</h1><section class="panel"><h2>Rate card</h2><form onsubmit="saveSettings(event)">${Object.entries(data.rates).map(([k,v])=>`<div class="item"><strong>${label(k)}</strong><div class="grid"><div><label>Standard ($)</label><input type="number" min="0" name="std_${k}" value="${v[0]}"></div><div><label>Internal floor ($)</label><input type="number" min="0" name="floor_${k}" value="${v[1]}"></div></div></div>`).join('')}<h2>Pricing and reminders</h2>${[['travelRate','Mileage charge ($ per billable mile)'],['freeMiles','Included round-trip miles'],['extraStroll','Additional strolling hour ($)'],['extraShow','Additional show hour ($)'],['feePercent','GigSalad platform fee estimate (%)'],['followDays','Follow-up delay (days)']].map(([k,l])=>`<label>${l}</label><input type="number" min="0" step="any" name="${k}" value="${data.settings[k]}">`).join('')}<div class="actions"><button class="primary" type="submit">Save settings</button></div></form></section><section class="panel"><h2>Backup and restore</h2><p class="muted">Data is stored only in this browser. Clearing site data or using another device may remove access. Export backups regularly.</p><div class="actions"><button class="secondary" onclick="exportJSON()">Export backup (JSON)</button><button class="secondary" onclick="exportCSV()">Export inquiries (CSV)</button></div><label>Restore JSON backup</label><input type="file" id="importFile" accept=".json,application/json" onchange="importJSON(event)"><p class="note">Restoring replaces all current app data. Keep your exported backup in a secure location because it may contain customer contact details.</p></section>`}function saveSettings(e){e.preventDefault();let f=new FormData(e.target);for(let k of Object.keys(data.rates)){let a=Number(f.get('std_'+k)),b=Number(f.get('floor_'+k));if(b>a){alert('Internal floor cannot exceed standard rate: '+label(k));return}data.rates[k]=[a,b]}for(let k of Object.keys(data.settings))data.settings[k]=Number(f.get(k));save();alert('Settings saved');render()}function download(name,contents,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([contents],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function exportJSON(){download('kex-magic-backup-'+date()+'.json',JSON.stringify(data,null,2),'application/json')}function exportCSV(){let keys=['customerName','contact','eventName','eventDate','inquiryDate','source','rateKey','location','duration','quotedPrice','bookedPrice','status','followDate','exception','notes'];let lines=[keys.join(','),...data.leads.map(x=>keys.map(k=>'"'+String(x[k]??'').replace(/"/g,'""')+'"').join(','))];download('kex-magic-inquiries-'+date()+'.csv',lines.join('\r\n'),'text/csv')}async function importJSON(e){let file=e.target.files[0];if(!file)return;try{let v=JSON.parse(await file.text());if(!Array.isArray(v.leads)||!Array.isArray(v.customers)||!v.rates||!v.settings)throw Error('Invalid backup structure');if(!confirm('Replace ALL current data with this backup?'))return;data=v;save();render();alert('Backup restored')}catch(err){alert('Import failed: '+err.message)}}render();if(page==='Pricing')calc();const oldNav=nav;nav=function(p){oldNav(p);if(p==='Pricing')calc()};
</script></body></html>
